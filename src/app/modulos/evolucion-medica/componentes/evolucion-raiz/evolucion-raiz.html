<div class="min-h-full bg-[#f1f5f9] text-slate-800">
  <ng-template #headerActions>
    <div class="flex gap-2 items-center">
      @if (evolucionService.viewMode() !== 'tray') {
        <button
          type="button"
          (click)="evolucionService.setViewMode('tray')"
          class="group flex items-center gap-2 font-semibold text-[13px] px-4 py-2 rounded-xl bg-white text-slate-600 border border-slate-200 hover:text-[#0f766e] hover:border-[#0f766e]/30 hover:bg-[#0f766e]/5 hover:shadow-[0_2px_8px_rgba(15,118,110,0.08)] transition-all duration-200"
        >
          <svg aria-hidden="true" class="w-4 h-4 text-slate-400 group-hover:text-[#0f766e] group-hover:-translate-x-0.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Volver a bandeja
        </button>
        @if (authService.hasPermission('imprimir')) {
          <button
            type="button"
            class="flex items-center gap-1.5 font-semibold text-xs px-3 py-1.5 rounded-lg bg-white text-[#07153a] border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm"
          >
            <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
            Imprimir
          </button>
        }
        @if (authService.hasPermission('agregar') || authService.hasPermission('modificar')) {
          <button
            type="button"
            class="flex items-center gap-1.5 font-semibold text-xs px-4 py-1.5 rounded-lg bg-[#263c7a] text-white border border-[#1a2d5e] hover:bg-[#1a2d5e] transition-colors shadow-sm"
          >
            <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Guardar Evolución
          </button>
        }
      }
    </div>
  </ng-template>

  <div class="relative w-full h-full">
    @if (evolucionService.viewMode() === 'tray') {
      <app-bandeja-pacientes class="block" />
    } @else {
      <app-formulario-soap class="block" />
    }
  </div>
</div>
