<h3 class="flex items-center gap-2 text-[13px] font-semibold text-teal-950 mb-5 pb-2 border-b border-slate-200">
  <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
  </svg>
  Examen físico por sistemas
</h3>

<div class="grid grid-cols-[140px_1fr] md:grid-cols-[170px_1fr] gap-x-3.5 gap-y-2.5 items-start">
  @for (control of formArray.controls; track i; let i = $index) {
    <ng-container [formGroup]="getFormGroup(i)">
      <div class="text-[12.6px] font-semibold pt-2 text-slate-800"
           [class.border-t]="i > 0" [class.border-dashed]="i > 0" [class.border-slate-200]="i > 0"
           [class.pt-2.5]="i > 0" [class.mt-0.5]="i > 0">
        {{ control.get('sistema')?.value }}
      </div>
      <textarea formControlName="hallazgos" rows="1"
                class="w-full border border-slate-200 rounded-md p-2.5 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none transition-all resize-y"
                [class.border-t]="i > 0" [class.border-dashed]="i > 0" [class.border-slate-200]="i > 0"
                [class.pt-2.5]="i > 0" [class.mt-0.5]="i > 0"
                placeholder="Hallazgos normales / anormales de {{ control.get('sistema')?.value | lowercase }}..."></textarea>
    </ng-container>
  }
</div>
