 
<div class="mb-8">
  <h3 class="flex items-center gap-2 text-[13px] font-semibold text-teal-950 mb-4 pb-2 border-b border-slate-200">
    <svg aria-hidden="true" class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path>
      <path d="m8.5 8.5 7 7"></path>
    </svg>
    Tratamiento farmacológico
  </h3>
  <div class="overflow-x-auto">
    <app-tabla [columnas]="columnasMedicamentos" [datos]="farmacologicoArray.controls" [cargando]="false"
               mensajeVacio="No hay medicamentos registrados.">

      <ng-template appColumnaTemplate="medicamentoCustom" let-ctrl let-i="index">
        <div [formGroup]="ctrl" class="p-1">
          <input type="text" [id]="'med_' + i" aria-label="Medicamento" formControlName="medicamento" class="w-full border border-slate-200 rounded p-1.5 text-[12.5px] bg-slate-50 text-slate-800" placeholder="Medicamento">
        </div>
      </ng-template>

      <ng-template appColumnaTemplate="dosisCustom" let-ctrl let-i="index">
        <div [formGroup]="ctrl" class="p-1">
          <input type="text" [id]="'dosis_' + i" aria-label="Dosis" formControlName="dosis" class="w-full border border-slate-200 rounded p-1.5 text-[12.5px] bg-slate-50 text-slate-800" placeholder="Ej. 500mg">
        </div>
      </ng-template>

      <ng-template appColumnaTemplate="frecuenciaCustom" let-ctrl let-i="index">
        <div [formGroup]="ctrl" class="p-1">
          <input type="text" [id]="'frec_' + i" aria-label="Frecuencia" formControlName="frecuencia" class="w-full border border-slate-200 rounded p-1.5 text-[12.5px] bg-slate-50 text-slate-800" placeholder="Ej. c/8h">
        </div>
      </ng-template>

      <ng-template appColumnaTemplate="viaCustom" let-ctrl let-i="index">
        <div [formGroup]="ctrl" class="p-1">
          <select [id]="'via_' + i" aria-label="Vía" formControlName="via" class="w-full border border-slate-200 rounded p-1.5 text-[12.5px] bg-slate-50 text-slate-800">
            <option>Oral</option>
            <option>Endovenosa</option>
            <option>Intramuscular</option>
            <option>Subcutánea</option>
            <option>Tópica</option>
            <option>Inhalatoria</option>
          </select>
        </div>
      </ng-template>

      <ng-template appColumnaTemplate="duracionCustom" let-ctrl let-i="index">
        <div [formGroup]="ctrl" class="p-1">
          <input type="text" [id]="'duracion_' + i" aria-label="Duración" formControlName="duracion" class="w-full border border-slate-200 rounded p-1.5 text-[12.5px] bg-slate-50 text-slate-800" placeholder="Ej. 7 días">
        </div>
      </ng-template>

      <ng-template appColumnaTemplate="accionesCustom" let-ctrl let-i="index">
        @if (authService.hasPermission('modificar') || authService.hasPermission('eliminar')) {
          <button type="button" class="text-slate-400 hover:text-rose-600 transition-colors mt-1.5" (click)="removerMedicamento(i)" title="Eliminar fila">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        }
      </ng-template>

    </app-tabla>
    @if (authService.hasPermission('agregar') || authService.hasPermission('modificar')) {
      <button type="button" class="mt-3 bg-teal-50 text-teal-700 border border-dashed border-teal-500 px-3 py-2 rounded-lg text-[12.6px] font-semibold hover:bg-teal-100 transition-colors"
        (click)="agregarMedicamento()">+ Agregar medicamento</button>
    }
  </div>
</div>


<div class="mb-8" [formGroup]="procedimientosIndicadosGroup">
  <h3 class="flex items-center gap-2 text-[13px] font-semibold text-teal-950 mb-4 pb-2 border-b border-slate-200">
    <svg aria-hidden="true" class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    Procedimientos indicados
  </h3>
  <div class="flex flex-wrap gap-x-5 gap-y-2.5 mb-4">
    <label class="flex items-center gap-1.5 text-[13px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
      <input type="checkbox" formControlName="curaciones" class="accent-teal-600 w-4 h-4"> Curaciones
    </label>
    <label class="flex items-center gap-1.5 text-[13px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
      <input type="checkbox" formControlName="suturas" class="accent-teal-600 w-4 h-4"> Suturas
    </label>
    <label class="flex items-center gap-1.5 text-[13px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
      <input type="checkbox" formControlName="cateter" class="accent-teal-600 w-4 h-4"> Catéter
    </label>
    <label class="flex items-center gap-1.5 text-[13px] text-slate-700 cursor-pointer hover:text-teal-700 transition-colors">
      <input type="checkbox" formControlName="intubacion" class="accent-teal-600 w-4 h-4"> Intubación
    </label>
  </div>
  <div class="flex flex-col">
    <label for="otroProcedimiento" class="text-[11.5px] font-semibold text-slate-500 mb-1">Otro procedimiento</label>
    <input type="text" id="otroProcedimiento" formControlName="otro" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-1 focus:ring-teal-600 focus:outline-none" placeholder="Especifique...">
  </div>
</div>


<div class="mb-8" [formGroup]="examenesGroup">
  <h3 class="flex items-center gap-2 text-[13px] font-semibold text-teal-950 mb-4 pb-2 border-b border-slate-200">
    <svg aria-hidden="true" class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="9" y1="13" x2="15" y2="13"></line>
      <line x1="9" y1="17" x2="13" y2="17"></line>
    </svg>
    Solicitud de exámenes
  </h3>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="flex flex-col">
      <label for="laboratorioSolicitado" class="text-[11.5px] font-semibold text-slate-500 mb-1">Laboratorio</label>
      <textarea id="laboratorioSolicitado" rows="2" formControlName="laboratorio" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none resize-y" placeholder="Ej. Hemograma de control"></textarea>
      <app-error-mensaje [control]="examenesGroup.get('laboratorio')"></app-error-mensaje>
    </div>
    <div class="flex flex-col">
      <label for="imagenesSolicitadas" class="text-[11.5px] font-semibold text-slate-500 mb-1">Imágenes</label>
      <textarea id="imagenesSolicitadas" rows="2" formControlName="imagenes" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none resize-y" placeholder="Ej. TAC abdominal"></textarea>
      <app-error-mensaje [control]="examenesGroup.get('imagenes')"></app-error-mensaje>
    </div>
    <div class="flex flex-col">
      <label for="otrosProcedimientos" class="text-[11.5px] font-semibold text-slate-500 mb-1">Otros procedimientos</label>
      <textarea id="otrosProcedimientos" rows="2" formControlName="otros" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none resize-y" placeholder="Ej. ECG de control"></textarea>
      <app-error-mensaje [control]="examenesGroup.get('otros')"></app-error-mensaje>
    </div>
  </div>
</div>


<div class="mb-8">
  <app-interconsultas></app-interconsultas>
</div>


<div class="mb-8" [formGroup]="indicacionesGroup">
  <h3 class="flex items-center gap-2 text-[13px] font-semibold text-teal-950 mb-4 pb-2 border-b border-slate-200">
    <svg aria-hidden="true" class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path>
      <rect x="9" y="3" width="6" height="4" rx="1"></rect>
      <path d="M9 12h6"></path>
      <path d="M9 16h6"></path>
    </svg>
    Indicaciones generales
  </h3>
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
    <div class="flex flex-col">
      <label for="dietaInd" class="text-[11.5px] font-semibold text-slate-500 mb-1">Dieta</label>
      <input type="text" id="dietaInd" formControlName="dieta" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-1 focus:ring-teal-600 focus:outline-none" placeholder="Ej. Blanda">
    </div>
    <div class="flex flex-col">
      <label for="reposoInd" class="text-[11.5px] font-semibold text-slate-500 mb-1">Reposo</label>
      <input type="text" id="reposoInd" formControlName="reposo" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-1 focus:ring-teal-600 focus:outline-none" placeholder="Ej. Relativo">
    </div>
    <div class="flex flex-col">
      <label for="hidratacionInd" class="text-[11.5px] font-semibold text-slate-500 mb-1">Hidratación</label>
      <input type="text" id="hidratacionInd" formControlName="hidratacion" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-1 focus:ring-teal-600 focus:outline-none" placeholder="Ej. VO libre demanda">
    </div>
    <div class="flex flex-col">
      <label for="oxigenoInd" class="text-[11.5px] font-semibold text-slate-500 mb-1">Oxígeno</label>
      <input type="text" id="oxigenoInd" formControlName="oxigeno" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-1 focus:ring-teal-600 focus:outline-none" placeholder="Ej. Cánula 2L/min">
    </div>
  </div>
  <div class="flex flex-col">
    <label for="restriccionesInd" class="text-[11.5px] font-semibold text-slate-500 mb-1">Restricciones</label>
    <textarea id="restriccionesInd" rows="2" formControlName="restricciones" class="w-full border border-slate-200 rounded-md p-2 text-[13.3px] bg-slate-50 text-slate-800 focus:ring-2 focus:ring-teal-600 focus:border-transparent outline-none resize-y" placeholder="Ej. Restricción de sodio, no deambular sin apoyo..."></textarea>
  </div>
</div>
