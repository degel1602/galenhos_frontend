<div class="gp-in" style="display: flex; flex-direction: column; gap: 18px; max-width: 560px;">
  <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 18px 20px;">
    <div style="font-size: 14px; font-weight: 600; color: #07153a; margin-bottom: 4px;">Conexión a la API</div>
    <p style="margin: 0 0 14px; font-size: 12.5px; color: #7a86a1;">URL base del backend de GALENOS PRO (Go + SQL Server).</p>

    <label style="display: block; font-size: 12px; font-weight: 600; color: #54617f; margin-bottom: 6px;">URL de la API</label>
    <div style="display: flex; gap: 10px;">
      <input
        [(ngModel)]="url"
        (input)="saved = false"
        placeholder="http://localhost:8080"
        style="flex: 1; padding: 10px 14px; border: 1px solid #d5dceb; border-radius: 11px; font-size: 14px; background: #f8fafc; color: #07153a;"
      />
      <button
        (click)="handleSave()"
        class="gp-primary-btn"
        style="padding: 10px 22px; background: #263c7a; color: #fff; border: none; border-radius: 11px; font-size: 14px; font-weight: 600; cursor: pointer;"
      >
        Guardar
      </button>
    </div>

    @if (saved) {
      <div style="margin-top: 12px; font-size: 12.5px; color: #059669; font-weight: 600;">
        Guardado. Se usará en la próxima petición.
      </div>
    }
  </div>

  <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 18px 20px;">
    <div style="font-size: 14px; font-weight: 600; color: #07153a; margin-bottom: 14px;">Sesión</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-size: 13px; font-weight: 600; color: #07153a;">{{ authService.username() ?? 'Operador' }}</div>
        <div style="font-size: 12px; color: #7a86a1;">Autenticado con Bearer token JWT</div>
      </div>
      <button
        (click)="authService.logout()"
        class="gp-ghost-btn"
        style="padding: 9px 18px; border: 1px solid #e0e6f1; border-radius: 11px; background: #fff; font-size: 13px; font-weight: 600; color: #dc2626; cursor: pointer;"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
