<div class="min-h-screen w-full bg-white font-sans flex">
  
  <!-- ============ PANEL IZQUIERDO ============ -->
  <aside class="hidden lg:flex lg:w-[54%] flex-col bg-[#040a14] overflow-hidden relative border-r border-slate-200/50">
    <!-- Imágenes de fondo en Slideshow Animado (4K) -->
    <div class="absolute inset-0 overflow-hidden">
      <div class="slideshow-bg" style="background-image: url('https://images.unsplash.com/photo-1516549655169-df83a0774514?ixlib=rb-1.2.1&auto=format&fit=crop&w=3840&q=100');"></div>
      <div class="slideshow-bg" style="background-image: url('https://images.unsplash.com/photo-1551076805-e1869033e561?ixlib=rb-1.2.1&auto=format&fit=crop&w=3840&q=100');"></div>
      <div class="slideshow-bg" style="background-image: url('https://images.unsplash.com/photo-1584982751601-97d8838d9673?ixlib=rb-1.2.1&auto=format&fit=crop&w=3840&q=100');"></div>
      <div class="slideshow-bg" style="background-image: url('https://images.unsplash.com/photo-1579684385127-1ef15d508118?ixlib=rb-1.2.1&auto=format&fit=crop&w=3840&q=100');"></div>
    </div>
    
    <!-- El sombreado de color oscuro (gradient) con opacidad reducida para que las fotos resalten -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#02050a]/70 via-[#040a14]/60 to-[#02050a]/70 backdrop-blur-[1px]"></div>
    <div class="absolute -top-48 -right-48 w-[560px] h-[560px] rounded-full bg-teal-500/20 blur-[130px]"></div>

    <!-- Contenido central (Únicamente la máquina de escribir) -->
    <div class="relative z-10 flex-1 flex flex-col justify-center px-12 xl:px-20 py-10">
      <div class="gp-anim-fade-up min-h-[220px]">
        <app-typewriter-text
          [texts]="heroTexts"
          fontFamily="'Space Grotesk', 'Roboto Mono', 'JetBrains Mono', ui-monospace, monospace"
          fontSize="clamp(40px, 4.5vw, 75px)"
          [fontWeight]="700"
          lineHeight="1.15em"
          letterSpacing="-0.03em"
          color="#FFFFFF"
          cursorColor="#2dd4bf"
          cursorBorderColor="#2dd4bf"
          [cursorWidth]="8"
          [cursorHeight]="50"
        ></app-typewriter-text>
      </div>
    </div>

    <!-- Footer minimalista -->
    <div class="relative z-10 shrink-0 px-12 xl:px-20 pb-10 xl:pb-12 text-[12px] text-slate-500 font-medium">
      <span>© 2026 GALENOS PRO</span>
    </div>
  </aside>

  <!-- ============ PANEL DERECHO (LOGIN) ============ -->
  <main class="flex-1 flex flex-col items-center justify-center relative bg-white px-6 py-12 sm:px-12 lg:px-16 xl:px-24">
    
    <div class="w-full max-w-[420px] mx-auto flex flex-col">
      <!-- Imagen del Equipo Médico -->
      <div class="w-full flex justify-center mb-6 gp-anim-fade-down">
        <img src="smiling-doctor.png" alt="Equipo Médico" class="w-[150px] h-[150px] object-contain drop-shadow-2xl">
      </div>

      <!-- Títulos -->
      <div class="mb-10 text-center gp-anim-fade-up">
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Bienvenido</h1>
        <p class="text-[14.5px] text-slate-500 mt-2">Ingrese sus credenciales para continuar.</p>
      </div>

      <!-- Alertas -->
      @if (error) {
        <div class="mb-6 bg-red-50 text-red-700 border border-red-100 text-[13.5px] font-medium px-4 py-3.5 rounded-xl gp-anim-fade-up flex items-start gap-3">
          <svg class="w-5 h-5 shrink-0 text-red-500 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ error }}
        </div>
      }

      <div class="bg-white rounded-2xl">
        <form (ngSubmit)="handleLogin()" class="space-y-5">
          
          <!-- Usuario -->
          <div class="gp-anim-fade-up" style="animation-delay: .12s">
            <label class="block text-[12.5px] font-semibold text-slate-700 mb-2" for="login-user">
              Usuario <span class="text-red-500">*</span>
            </label>
            <div class="relative group">
              <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-slate-400 group-focus-within:text-teal-600 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                type="text"
                id="login-user"
                [(ngModel)]="user"
                name="user"
                (input)="error = ''"
                placeholder="Nombre de usuario"
                autocomplete="username"
                class="w-full pl-11 pr-4 py-[14px] border border-slate-200 rounded-xl text-[14.5px] text-slate-900 bg-white placeholder:text-slate-400 focus:outline-none focus:ring-[3px] focus:ring-teal-500/20 focus:border-teal-500 transition-all shadow-sm"
              />
            </div>
          </div>

          <!-- Contraseña -->
          <div class="gp-anim-fade-up" style="animation-delay: .18s">
            <label class="block text-[12.5px] font-semibold text-slate-700 mb-2" for="login-pass">
              Contraseña <span class="text-red-500">*</span>
            </label>
            <div class="relative group">
              <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-slate-400 group-focus-within:text-teal-600 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input
                id="login-pass"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="pass"
                name="pass"
                (input)="error = ''"
                placeholder="••••••••"
                autocomplete="current-password"
                class="w-full pl-11 pr-12 py-[14px] border border-slate-200 rounded-xl text-[14.5px] text-slate-900 bg-white placeholder:text-slate-400 focus:outline-none focus:ring-[3px] focus:ring-teal-500/20 focus:border-teal-500 transition-all shadow-sm"
              />
              <button
                type="button"
                (click)="showPassword = !showPassword"
                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer p-1 transition-colors"
                [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                @if (showPassword) {
                  <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                } @else {
                  <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                }
              </button>
            </div>
          </div>

          <!-- Botón Iniciar Sesión -->
          <button
            type="submit"
            [disabled]="loading"
            class="gp-anim-fade-up w-full mt-4 py-[15px] rounded-xl bg-[#040a14] text-white text-[14.5px] font-bold tracking-wide shadow-md shadow-[#040a14]/20 hover:bg-[#0a1a35] hover:shadow-lg hover:-translate-y-0.5 active:scale-[.985] active:translate-y-0 transition-all duration-300 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0 cursor-pointer"
            style="animation-delay: .24s">
            <span class="relative z-10 flex items-center justify-center">
            @if (loading) {
              <span class="flex items-center justify-center gap-2">
                <svg class="w-4 h-4 animate-spin text-teal-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                  <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                </svg>
                Ingresando…
              </span>
            } @else {
              Iniciar sesión
            }
            </span>
          </button>
        </form>
      </div>
    </div>
  </main>
</div>
