<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(1200px 600px at 15% -10%, #16265c 0%, transparent 55%), radial-gradient(1000px 700px at 110% 120%, #1b2f6b 0%, transparent 50%), linear-gradient(160deg,#07153a 0%,#0a1a45 100%);">
  <div class="gp-in" style="width: 100%; max-width: 412px; display: flex; flex-direction: column; align-items: center; gap: 22px;">
    
    <div style="background: #fff; border-radius: 16px; padding: 16px 26px; box-shadow: 0 18px 45px rgba(3,10,30,.45);">
      <logotipo [size]="26"></logotipo>
    </div>

    <div style="width: 100%; background: #fff; border-radius: 20px; padding: 32px 30px; box-shadow: 0 24px 60px rgba(3,10,30,.4);">
      <h1 style="margin: 0 0 4px; font-size: 22px; font-weight: 700; color: #07153a;">Bienvenido a GALENOS PRO</h1>
      <p style="margin: 0 0 22px; font-size: 13.5px; color: #6b7794;">Sistema de Gestión de Citas Médicas</p>

      @if (error) {
        <div style="display: flex; align-items: center; gap: 9px; background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; font-size: 13px; font-weight: 500; padding: 10px 13px; border-radius: 11px; margin-bottom: 16px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
          <span>{{ error }}</span>
        </div>
      }

      <label style="display: block; font-size: 12px; font-weight: 600; color: #54617f; margin-bottom: 6px;">
        Usuario <span style="color: #dc2626;">*</span>
      </label>
      <div style="position: relative; margin-bottom: 16px;">
        <svg style="position: absolute; left: 13px; top: 12px; color: #9aa6c0;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
        </svg>
        <input 
          [(ngModel)]="user"
          (input)="error = ''"
          (keydown.enter)="handleLogin()"
          placeholder="usuario"
          style="width: 100%; padding: 11px 14px 11px 40px; border: 1px solid #d5dceb; border-radius: 11px; font-size: 14px; background: #f8fafc; color: #07153a;"
        />
      </div>

      <label style="display: block; font-size: 12px; font-weight: 600; color: #54617f; margin-bottom: 6px;">
        Contraseña <span style="color: #dc2626;">*</span>
      </label>
      <div style="position: relative; margin-bottom: 20px;">
        <svg style="position: absolute; left: 13px; top: 12px; color: #9aa6c0;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input 
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="pass"
          (input)="error = ''"
          (keydown.enter)="handleLogin()"
          placeholder="••••••••"
          style="width: 100%; padding: 11px 40px 11px 40px; border: 1px solid #d5dceb; border-radius: 11px; font-size: 14px; background: #f8fafc; color: #07153a;"
        />
        <button 
          (click)="showPassword = !showPassword"
          type="button"
          style="position: absolute; right: 13px; top: 10px; background: none; border: none; cursor: pointer; color: #9aa6c0; padding: 0; display: flex; align-items: center; justify-content: center;">
          @if (showPassword) {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </button>
      </div>

      <button 
        (click)="handleLogin()"
        [disabled]="loading"
        class="gp-primary-btn"
        style="width: 100%; padding: 13px; background: #263c7a; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 20px rgba(38,60,122,.35);"
      >
        {{ loading ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>

      <div style="display: flex; align-items: center; gap: 10px; margin: 18px 0;">
        <span style="flex: 1; height: 1px; background: #e6eaf2;"></span>
        <span style="font-size: 11px; color: #9aa6c0;">sin backend</span>
        <span style="flex: 1; height: 1px; background: #e6eaf2;"></span>
      </div>
      <button 
        (click)="loginDemo()"
        class="gp-ghost-btn"
        style="width: 100%; padding: 12px; background: #fff; color: #263c7a; border: 1px dashed #c7d0e2; border-radius: 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;"
      >
        Entrar en modo demo (sin backend)
      </button>

    </div>

    <p style="margin: 0; font-size: 12px; color: #8aa0d4;">© 2026 GALENOS PRO · Sistema de Citas Médicas</p>
  </div>
</div>
