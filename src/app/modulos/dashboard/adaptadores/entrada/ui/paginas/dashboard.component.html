<div class="gp-in">
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px;">
    <!-- KpiCard 1 -->
    <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 16px 16px 15px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; color: #7a86a1; font-weight: 500;">Pacientes registrados</span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #e0e9fb; display: flex; align-items: center; justify-content: center; color: #263c7a;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /></svg>
        </span>
      </div>
      <div style="font-size: 26px; font-weight: 700; color: #07153a; margin-top: 8px;">
        @if (totalPacientes === null) {
          {{ error ? '—' : '…' }}
        } @else {
          {{ totalPacientes }}
        }
      </div>
      <div [style.color]="error ? '#dc2626' : '#7a86a1'" style="font-size: 11px; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        {{ error || 'Total en el sistema' }}
      </div>
    </div>

    <!-- KpiCard 2 -->
    <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 16px 16px 15px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; color: #7a86a1; font-weight: 500;">API</span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #e0f2e9; display: flex; align-items: center; justify-content: center; color: #059669;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="8" rx="2" /><rect x="2" y="13" width="20" height="8" rx="2" /><line x1="6" y1="7" x2="6.01" y2="7" /><line x1="6" y1="17" x2="6.01" y2="17" /></svg>
        </span>
      </div>
      <div style="font-size: 26px; font-weight: 700; color: #07153a; margin-top: 8px;">Conectada</div>
      <div style="font-size: 11px; color: #7a86a1; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        {{ apiBaseUrl }}
      </div>
    </div>

    <!-- KpiCard 3 -->
    <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 16px 16px 15px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; color: #7a86a1; font-weight: 500;">Sesión</span>
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #fef0dc; display: flex; align-items: center; justify-content: center; color: #d97706;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
        </span>
      </div>
      <div style="font-size: 26px; font-weight: 700; color: #07153a; margin-top: 8px;">Activa</div>
      <div style="font-size: 11px; color: #7a86a1; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        Bearer token JWT
      </div>
    </div>
  </div>

  <div style="background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 18px 20px;">
    <div style="font-size: 14px; font-weight: 600; color: #07153a; margin-bottom: 14px;">Acciones rápidas</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <!-- Quick Action 1 -->
      <button (click)="navigateTo('pacientes')" class="gp-switch-btn" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border: 1px solid #dbe3f4; border-radius: 14px; background: #f7faff; cursor: pointer; text-align: left;">
        <span style="width: 38px; height: 38px; border-radius: 10px; background: #263c7a; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #07153a;">Buscar paciente</span>
      </button>

      <!-- Quick Action 2 -->
      <button (click)="navigateTo('citas')" class="gp-switch-btn" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border: 1px solid #dbe3f4; border-radius: 14px; background: #f7faff; cursor: pointer; text-align: left;">
        <span style="width: 38px; height: 38px; border-radius: 10px; background: #66b6ff; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #07153a;">Agendar cita</span>
      </button>
    </div>
  </div>
</div>
