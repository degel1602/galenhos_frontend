<div class="bg-white border border-slate-200 rounded-xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] p-5">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5 pb-4 border-b border-slate-100">
    <h2 class="text-slate-800 font-bold flex items-center gap-2 text-base">
      <svg aria-hidden="true" class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icono"></path>
      </svg>
      {{ titulo }}
    </h2>
    <div class="flex gap-2">
      <ng-content select="[acciones]"></ng-content>
    </div>
  </div>
  <ng-content></ng-content>
</div>
