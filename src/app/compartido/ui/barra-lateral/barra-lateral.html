<aside
  class="shrink-0 bg-[#0B1120] flex flex-col border-r border-slate-800/60 h-full transition-all duration-300 relative z-20"
  [class.w-[260px]]="!isCollapsed" [class.w-[80px]]="isCollapsed">

  <!-- Logo Section -->
  <div class="pt-7 pb-6 transition-all duration-300 flex items-center h-[80px]" [class.px-6]="!isCollapsed"
    [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
    @if (!isCollapsed) {
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-tr from-teal-600 to-teal-400 flex items-center justify-center shadow-[0_0_15px_rgba(45,212,191,0.3)]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
      </div>
      <div class="font-bold text-lg tracking-wide text-white flex gap-1">
        GALENOS<span class="text-teal-400">PRO</span>
      </div>
    </div>
    } @else {
    <div
      class="w-10 h-10 rounded-lg bg-gradient-to-tr from-teal-600 to-teal-400 flex items-center justify-center shadow-[0_0_15px_rgba(45,212,191,0.3)]">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
    </div>
    }
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 flex flex-col gap-1.5 overflow-x-hidden custom-scrollbar">
    <a routerLink="/dashboard" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Dashboard</span>
    </a>

    <a routerLink="/pacientes" routerLinkActive="active-nav"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Pacientes</span>
    </a>

    <a routerLink="/triaje" routerLinkActive="active-nav"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Triaje</span>
    </a>

    <a routerLink="/admisiones" routerLinkActive="active-nav"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Admisiones</span>
    </a>

    <a routerLink="/citas" routerLinkActive="active-nav"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Citas Médicas</span>
    </a>

    <a routerLink="/evolucion" routerLinkActive="active-nav"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Evolución</span>
    </a>

    <a routerLink="/configuracion" routerLinkActive="active-nav"
      class="group flex items-center w-full py-3 rounded-lg cursor-pointer text-[13px] font-medium transition-all duration-200 text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 [&.active-nav]:bg-teal-500/10 [&.active-nav]:text-teal-400 relative overflow-hidden mt-auto"
      [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <div
        class="absolute left-0 top-0 bottom-0 w-0.5 bg-teal-400 scale-y-0 transition-transform origin-left group-[.active-nav]:scale-y-100 rounded-r-full">
      </div>
      <svg class="shrink-0 group-[.active-nav]:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] transition-colors" width="18"
        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="21" x2="4" y2="14"></line>
        <line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line>
        <line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="2" y1="14" x2="6" y2="14"></line>
        <line x1="10" y1="8" x2="14" y2="8"></line>
        <line x1="18" y1="16" x2="22" y2="16"></line>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed"
        [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Configuración</span>
    </a>
  </nav>

  <!-- User Profile & Logout Section -->
  <div class="p-4 pt-0 transition-all duration-300">
    <div
      class="rounded-xl bg-[#0F172A]/80 border border-slate-800/80 shadow-lg backdrop-blur-sm transition-all duration-300 relative group"
      [class.p-3]="!isCollapsed" [class.p-2]="isCollapsed">

      <div class="flex items-center" [class.gap-3]="!isCollapsed" [class.justify-center]="isCollapsed">

        <!-- Avatar Box -->
        <div
          class="w-10 h-10 shrink-0 rounded-lg bg-teal-500/10 border border-teal-500/20 flex items-center justify-center text-teal-400 font-bold text-sm shadow-inner transition-transform group-hover:scale-105">
          {{ initials() }}
        </div>

        @if (!isCollapsed) {
        <div class="flex-1 min-w-0">
          <div class="text-[13px] font-semibold text-slate-200 truncate">{{ username || 'Sesión activa' }}</div>
          <div class="text-[11px] text-slate-500 font-medium tracking-wide">Operador clínico</div>
        </div>

        <!-- Logout Button -->
        <button (click)="logout()" title="Cerrar sesión"
          class="p-2 -mr-1 rounded-md text-slate-500 hover:text-red-400 hover:bg-red-400/10 transition-colors cursor-pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
        } @else {
        <!-- Hover Overlay for Collapsed State Logout -->
        <button (click)="logout()" title="Cerrar sesión"
          class="absolute inset-0 w-full h-full rounded-xl bg-red-500/90 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer backdrop-blur-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
        }
      </div>
    </div>
  </div>
</aside>
