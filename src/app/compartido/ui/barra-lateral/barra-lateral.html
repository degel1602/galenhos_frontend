<aside class="shrink-0 bg-[#07153a] flex flex-col border-r border-[#102352] h-full transition-all duration-300"
       [class.w-[262px]]="!isCollapsed" 
       [class.w-[84px]]="isCollapsed">
  <!-- Logo Section -->
  <div class="pt-6 pb-4 transition-all duration-300" [class.px-5]="!isCollapsed" [class.px-4]="isCollapsed">
    <div class="bg-white rounded-xl py-3 flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.15)] h-[48px]"
         [class.px-4]="!isCollapsed" [class.px-0]="isCollapsed">
      @if (!isCollapsed) {
        <logotipo [size]="20"></logotipo>
      } @else {
        <div class="text-[#263c7a] font-bold text-[18px]">G<span class="text-[#66b6ff]">P</span></div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-3.5 py-2 flex flex-col gap-1.5 mt-2 overflow-x-hidden">
    <a routerLink="/dashboard" routerLinkActive="active-nav" [routerLinkActiveOptions]="{exact: true}"
       class="group flex items-center w-full py-3 rounded-[11px] cursor-pointer text-[13.5px] font-medium transition-all duration-200 bg-transparent text-slate-400 hover:bg-[#11214a]/60 hover:text-slate-200 [&.active-nav]:bg-[#11214a] [&.active-nav]:text-white [&.active-nav]:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <svg class="shrink-0 group-[.active-nav]:text-blue-400 group-[.active-nav]:drop-shadow-[0_0_6px_rgba(96,165,250,0.4)]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed" [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Dashboard</span>
    </a>

    <a routerLink="/pacientes" routerLinkActive="active-nav"
       class="group flex items-center w-full py-3 rounded-[11px] cursor-pointer text-[13.5px] font-medium transition-all duration-200 bg-transparent text-slate-400 hover:bg-[#11214a]/60 hover:text-slate-200 [&.active-nav]:bg-[#11214a] [&.active-nav]:text-white [&.active-nav]:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <svg class="shrink-0 group-[.active-nav]:text-blue-400 group-[.active-nav]:drop-shadow-[0_0_6px_rgba(96,165,250,0.4)]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed" [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Pacientes</span>
    </a>

    <a routerLink="/triaje" routerLinkActive="active-nav"
       class="group flex items-center w-full py-3 rounded-[11px] cursor-pointer text-[13.5px] font-medium transition-all duration-200 bg-transparent text-slate-400 hover:bg-[#11214a]/60 hover:text-slate-200 [&.active-nav]:bg-[#11214a] [&.active-nav]:text-white [&.active-nav]:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <svg class="shrink-0 group-[.active-nav]:text-blue-400 group-[.active-nav]:drop-shadow-[0_0_6px_rgba(96,165,250,0.4)]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed" [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Triaje</span>
    </a>

    <a routerLink="/admisiones" routerLinkActive="active-nav"
       class="group flex items-center w-full py-3 rounded-[11px] cursor-pointer text-[13.5px] font-medium transition-all duration-200 bg-transparent text-slate-400 hover:bg-[#11214a]/60 hover:text-slate-200 [&.active-nav]:bg-[#11214a] [&.active-nav]:text-white [&.active-nav]:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <svg class="shrink-0 group-[.active-nav]:text-blue-400 group-[.active-nav]:drop-shadow-[0_0_6px_rgba(96,165,250,0.4)]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed" [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Admisiones</span>
    </a>

    <a routerLink="/citas" routerLinkActive="active-nav"
       class="group flex items-center w-full py-3 rounded-[11px] cursor-pointer text-[13.5px] font-medium transition-all duration-200 bg-transparent text-slate-400 hover:bg-[#11214a]/60 hover:text-slate-200 [&.active-nav]:bg-[#11214a] [&.active-nav]:text-white [&.active-nav]:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <svg class="shrink-0 group-[.active-nav]:text-blue-400 group-[.active-nav]:drop-shadow-[0_0_6px_rgba(96,165,250,0.4)]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed" [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Citas Médicas</span>
    </a>

    <a routerLink="/configuracion" routerLinkActive="active-nav"
       class="group flex items-center w-full py-3 rounded-[11px] cursor-pointer text-[13.5px] font-medium transition-all duration-200 bg-transparent text-slate-400 hover:bg-[#11214a]/60 hover:text-slate-200 [&.active-nav]:bg-[#11214a] [&.active-nav]:text-white [&.active-nav]:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]"
       [class.justify-center]="isCollapsed" [class.px-4]="!isCollapsed" [class.gap-3.5]="!isCollapsed">
      <svg class="shrink-0 group-[.active-nav]:text-blue-400 group-[.active-nav]:drop-shadow-[0_0_6px_rgba(96,165,250,0.4)]" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="2" y1="14" x2="6" y2="14"></line><line x1="10" y1="8" x2="14" y2="8"></line>
        <line x1="18" y1="16" x2="22" y2="16"></line>
      </svg>
      <span class="whitespace-nowrap transition-opacity duration-200" [class.opacity-0]="isCollapsed" [class.w-0]="isCollapsed" [class.hidden]="isCollapsed">Configuración</span>
    </a>
  </nav>

  <!-- User Profile Section -->
  <div class="mb-4 rounded-2xl bg-[#0b1b42] border border-[#142654] shadow-inner transition-all duration-300 overflow-hidden cursor-pointer hover:bg-[#0e214d]"
       [class.mx-4]="!isCollapsed" [class.p-4]="!isCollapsed"
       [class.mx-3]="isCollapsed" [class.p-2.5]="isCollapsed"
       (click)="logout()" title="Cerrar sesión">
    <div class="flex items-center" [class.gap-3]="!isCollapsed" [class.justify-center]="isCollapsed">
      <div class="w-9 h-9 shrink-0 rounded-[10px] bg-gradient-to-b from-[#263c7a] to-[#1a2d5c] flex items-center justify-center text-[#66b6ff] font-bold text-sm shadow-sm border border-[#2a4387]/50">
        {{ initials() }}
      </div>
      @if (!isCollapsed) {
        <div class="flex-1 min-w-0">
          <div class="text-[12.5px] font-semibold text-[#e2e8f0] truncate">{{ username || 'Sesión activa' }}</div>
          <div class="text-[11px] text-[#7d8cba] font-medium">Operador clínico</div>
        </div>
        <div class="text-[#7d8cba] p-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>
      }
    </div>
  </div>
</aside>
