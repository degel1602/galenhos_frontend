<header class="h-[66px] shrink-0 bg-white border-b border-[#e3e8f2] flex items-center justify-between px-[30px]">
      <div class="flex items-center gap-4">
        <div>
          <div class="text-[11px] text-[#94a0bd] font-medium tracking-[.04em]">GALENOS PRO</div>
          <h2 class="m-0 mt-[1px] text-[19px] font-bold text-[#07153a]">{{ title }}</h2>
        </div>
      </div>
      <div class="flex-1 flex justify-end px-6">
        <ng-container *ngTemplateOutlet="headerActions.template()"></ng-container>
      </div>

      <div class="flex items-center gap-[14px]">
        <div class="relative">
          <!-- Trigger -->
          <button type="button" (click)="toggleMenu()" class="group flex items-center gap-3 p-1.5 pr-4 rounded-full transition-all duration-200 cursor-pointer bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 hover:shadow-sm">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-[#07153a] to-[#263c7a] text-white flex items-center justify-center font-bold text-[14px] shadow-inner shrink-0 relative overflow-hidden">
              <span class="relative z-10">{{ (username || 'O')[0] | uppercase }}</span>
            </div>
            <div class="flex flex-col items-start hidden sm:flex">
              <span class="text-[13.5px] font-bold text-[#07153a] leading-tight">{{ username || 'Operador' }}</span>
              <span class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider mt-0.5">Médico Tratante</span>
            </div>
            <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center ml-1 group-hover:bg-slate-200 transition-colors">
              <svg aria-hidden="true" class="w-3.5 h-3.5 text-slate-600 transition-transform duration-300" [class.rotate-180]="isMenuOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </button>
          
          <!-- Dropdown Menu -->
          <div class="absolute right-0 top-[calc(100%+8px)] w-48 bg-white border border-[#e3e8f2] rounded-xl shadow-[0_10px_30px_rgba(7,21,58,0.08)] transition-all duration-200 origin-top-right z-50 overflow-hidden"
               [class.opacity-100]="isMenuOpen()" [class.visible]="isMenuOpen()" [class.opacity-0]="!isMenuOpen()" [class.invisible]="!isMenuOpen()"
               [class.scale-100]="isMenuOpen()" [class.scale-95]="!isMenuOpen()">
            <div class="px-4 py-3 border-b border-[#e3e8f2] bg-[#f8fafc]">
              <p class="text-[11px] font-semibold text-[#94a0bd] uppercase tracking-wider mb-0.5">Operador clínico</p>
              <p class="text-[13px] font-bold text-[#07153a] truncate">{{ username || 'Sesión Activa' }}</p>
            </div>
            <div class="p-1.5">
              <button type="button" (click)="logoutEvent.emit(); isMenuOpen.set(false)" class="w-full flex items-center gap-2.5 px-3 py-2 text-[13px] font-semibold text-[#ef4444] hover:bg-[#fef2f2] rounded-lg transition-colors cursor-pointer text-left">
                <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Cerrar Sesión
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
